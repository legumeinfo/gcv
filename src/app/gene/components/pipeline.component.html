<div class="ms-2 me-2 btn-group pipeline d-flex flex-fill" role="group">
  @if (info) {
    <a (click)="infoTooltip($event, info)" class="btn btn-light flex-grow-0"
      ><i class="fas fa-question-circle"></i
    ></a>
  }
  @for (name of processNames; track name) {
    @if (getProcess(name) | async; as p) {
      @if (p.status | async; as status) {
        <a
          (click)="processTooltip($event, p)"
          class="btn pipeline-arrow flex-fill {{ statusToClass(status) }}"
        >
          <i class="{{ statusToIcon(status) }}"></i> {{ name }}
        </a>
      }
    }
  }
</div>
<div [gcvTooltipFactory]="tooltipComponents"></div>
