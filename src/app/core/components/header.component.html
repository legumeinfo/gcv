<nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
  <div class="container-fluid">
    @if (brand !== undefined) {
      <a
        class="navbar-brand"
        href="{{ brand.url }}"
        (mouseenter)="toggleBrand()"
        (mouseleave)="toggleBrand()"
      >
        <img
          src="{{ brand.img }}"
          class="d-inline-block align-text-top"
          alt=""
        />
      </a>
    }
    <a
      class="navbar-brand brand-name collapse collapse-horizontal"
      href="{{ brand.url }}"
      #brandText
    >
      @if (brand.slogan === undefined) {
        {{ brand.name }}
      }
      @if (brand.slogan !== undefined) {
        <span>{{ brand.name }}</span>
        <small>{{ brand.slogan }}</small>
      }
    </a>
    <div class="collapse navbar-collapse">
      <router-outlet name="header-left"></router-outlet>
      <ng-content select="[left]"></ng-content>
      <div class="flex-grow-1 flex-fill">
        <div class="navbar-right">
          <gcv-expand-search-widget></gcv-expand-search-widget>
        </div>
        <div class="navbar-right">
          <ul class="navbar-nav me-auto">
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                id="navbarDropdown"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Help
              </a>
              <div
                class="dropdown-menu dropdown-menu-end"
                aria-labelledby="dropdownMenuLink"
              >
                <a
                  class="dropdown-item"
                  [routerLink]="['/instructions']"
                  target="_blank"
                  >Instructions</a
                >
                <a
                  class="dropdown-item"
                  href="https://github.com/legumeinfo/gcv/wiki"
                  target="_blank"
                  >Documentation</a
                >
                <a
                  class="dropdown-item"
                  href="https://doi.org/10.1093/nar/gkad391"
                  target="_blank"
                  >Manuscript</a
                >
                <div class="dropdown-divider"></div>
                <a
                  class="dropdown-item"
                  href="https://github.com/legumeinfo/gcv/issues"
                  target="_blank"
                  >Contact developers</a
                >
              </div>
            </li>
          </ul>
        </div>
        <div class="navbar-right">
          <router-outlet name="header-right"></router-outlet>
          <ng-content select="[right]"></ng-content>
        </div>
        <div class="flex-grow-1 flex-fill">
          <router-outlet name="header-center"></router-outlet>
          <ng-content select="[center]"></ng-content>
        </div>
      </div>
    </div>
  </div>
</nav>
